name: kasvault_wallet
description: Android-first Kaspa wallet with a native Rust signing boundary.
publish_to: none
version: 0.11.16+74

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  app_links: ^7.2.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  package_info_plus: ^9.0.1
  qr_code_scanner_plus: ^2.2.0
  qr_flutter: ^4.1.0
  reown_walletkit: ^1.4.0
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/kaspire_wordmark.png
    - assets/branding/hub21_wordmark.png
