[package]
name = "kaspa_secure_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
blake3 = "1.8.2"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
hex = "0.4.3"
getrandom = { version = "0.2.17", features = ["js"] }
jni = "0.21.1"
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-bip32 = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
secp256k1 = { version = "0.29.1", features = ["rand-std", "recovery"] }
silverscript-lang = { path = "../silverscript_lang" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
rlp = "0.5.2"
thiserror = "2.0.12"
zeroize = { version = "1.8.1", features = ["derive"] }

# Native-only experiment. Do not alter the existing extension WASM dependency
# graph or its locally audited legacy Silverscript templates.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
silverscript-v1 = { package = "silverscript-lang", git = "https://github.com/kaspanet/silverscript", rev = "3ed973335b59269293564805cc2c58a14595ec03" }
chacha20poly1305 = "=0.10.1"
ml-kem = { version = "=0.3.2", features = ["zeroize", "hazmat"] }
ml-dsa = { version = "=0.1.1", features = ["zeroize"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
wasm-bindgen = "0.2.100"

[features]
default = ["rusty-kaspa-v2_1_0"]
rusty-kaspa-v2_1_0 = []
