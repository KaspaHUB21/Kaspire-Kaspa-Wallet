[package]
name = "kaspa_secure_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
hex = "0.4.3"
getrandom = { version = "0.2.17", features = ["js"] }
jni = "0.21.1"
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-bip32 = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
secp256k1 = { version = "0.29.1", features = ["rand-std"] }
silverscript-lang = { path = "../silverscript_lang" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
zeroize = { version = "1.8.1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
wasm-bindgen = "0.2.100"

[features]
default = ["rusty-kaspa-v2_0_1"]
rusty-kaspa-v2_0_1 = []
