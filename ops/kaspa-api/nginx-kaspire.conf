limit_req_zone $binary_remote_addr zone=kaspire_api:10m rate=20r/s;

server {
    server_name kaspire.kaslab.space;

    root /var/www/kaspire/public;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        etag off;
        if_modified_since off;
        try_files /index.html =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Wallet addresses and pairing URIs are privacy-sensitive. Do not retain
    # either in the nginx access log.
    location ^~ /api/ {
        access_log off;
        client_max_body_size 16m;
        limit_req zone=kaspire_api burst=40 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /kaspire/wc {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        etag off;
        if_modified_since off;
        try_files $uri $uri/ /kaspire/wc/index.html;
    }

    # The update manifest changes independently of the website build. Prevent
    # browsers, carrier proxies and intermediate caches from returning a
    # previously signed release after a newer version has been published.
    location = /updates/android.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # One public APK only. Releases replace this file; no nginx version edit
    # or reload is required for subsequent APK releases.
    location = /downloads/Kaspire-Android-mainnet-latest.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Kaspire-Android-mainnet-latest.apk"' always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Do not append bytes from a newer release to an older partial APK.
        max_ranges 0;
        etag off;
        if_modified_since off;
        try_files $uri =404;
    }

    # Includes historical versioned links from installed apps' signed update
    # manifests. Drop old query strings and never cache the redirect.
    location ~* \.apk$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        return 302 /downloads/Kaspire-Android-mainnet-latest.apk;
    }

    location /downloads/ {
        types {
            application/vnd.android.package-archive apk;
        }
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/kaspire.kaslab.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaspire.kaslab.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name kaspire.kaslab.space;
    return 301 https://$host$request_uri;
}
