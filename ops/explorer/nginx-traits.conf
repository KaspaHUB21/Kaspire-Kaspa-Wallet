# Include only in the existing kaspanftnexus.com HTTPS server.
location ~ "^/api/collections/[a-z0-9]{1,64}/traits$" {
    if ($request_method != GET) { return 405; }
    limit_req zone=kasnftnexus_collection_traits burst=6 nodelay;
    limit_req_status 429;
    access_log off;
    proxy_pass http://127.0.0.1:3022;
    proxy_read_timeout 40s;
    proxy_set_header Host kaspanftnexus.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
}
