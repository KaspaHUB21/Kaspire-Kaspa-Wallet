Builds:
  - versionName: 0.10.7
    versionCode: 42
    commit: v0.10.7
    subdir: apps/mobile_flutter
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.6
      - rustup@1.28.2
    rm:
      - Kaspire-Android-mainnet-v0.9.1.apk
