AutoName: Kaspire
Summary: Self-custody wallet for the Kaspa ecosystem
Description: |-
  Kaspire is a native Android self-custody wallet for Kaspa Mainnet.

  Seeds and private keys remain encrypted on the device. Wallet creation,
  derivation, transaction validation and signing cross a native Rust security
  boundary. Kaspire supports KAS, KRC-20, KRC-721, KNS and verified KCC20
  covenant assets, multiple wallets, BIP39 passphrases, address-index
  subwallets, transaction details, UTXO compound and encrypted backups.

  WalletConnect uses Kaspire's public Reown project identifier and the Reown
  relay. No advertising, analytics or proprietary Google Play service is
  included.

RepoType: git
