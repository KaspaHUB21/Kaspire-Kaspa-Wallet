AutoName: Kaspire
Summary: Self-custody wallet for Kaspa and its L1 assets
Description: |-
  Kaspire is an open-source Android self-custody wallet for the Kaspa
  ecosystem. It supports Kaspa Mainnet and TN10 Testnet.

  Create or import BIP39 wallets, use optional BIP39 passphrases, manage
  multiple wallets, BIP44 accounts and address-index subwallets, or add
  watch-only wallets. Kaspire supports KAS, KRC20, KRC721, KNS, legacy KCC20
  and KRON KCC20 assets, detailed transaction activity, UTXO compounding,
  encrypted WalletConnect sessions and policy-bound PSKT signing.

  Sensitive wallet operations cross a native Rust security boundary. Seeds
  and private keys are encrypted locally, transaction data is independently
  validated before signing, and portable backups use Argon2id with
  AES-256-GCM.

  Kaspire contains no advertising, analytics or proprietary Google Play
  service. Network access is required for blockchain data, token metadata and
  WalletConnect relay transport.

